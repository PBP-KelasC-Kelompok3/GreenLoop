{% load static %}
{% with current=request.resolver_match.url_name %}
<aside class="sidebar" id="sidebar">

    <a class="brand" href="{% url 'courier:show_dashboard' %}">
        <img src="{% static 'img/Logo_Lockup.png' %}" alt="GreenLoop">
    </a>
    <span class="role-pill">Kurir Lapangan</span>

    <p class="menu-label">Menu</p>
    <nav class="menu">
        <a href="{% url 'courier:show_dashboard' %}" class="menu-item {% if current == 'show_dashboard' %}active{% endif %}">
            <i data-lucide="layout-dashboard"></i><span>Dashboard Kurir</span>
        </a>
        <a href="{% url 'courier:show_route_today' %}" class="menu-item {% if current == 'show_route_today' %}active{% endif %}">
            <i data-lucide="map"></i><span>Rute Hari Ini</span>
        </a>
        <a href="{% url 'courier:show_history' %}" class="menu-item {% if current == 'show_history' %}active{% endif %}">
            <i data-lucide="history"></i><span>Riwayat Pikap</span>
        </a>
        <a href="{% url 'courier:show_recap' %}" class="menu-item {% if current == 'show_recap' %}active{% endif %}">
            <i data-lucide="scale"></i><span>Rekap Timbangan</span>
        </a>
        <a href="{% url 'courier:show_profile' %}" class="menu-item {% if current == 'show_profile' %}active{% endif %}">
            <i data-lucide="user"></i><span>Profil Kurir</span>
        </a>
    </nav>

    <div class="sidebar-bottom">
        <div class="pilot-card">
            <p class="pilot-title"><i data-lucide="map-pin"></i> Area Pilot: Kota Depok</p>
            <p>Layanan penjemputan saat ini khusus wilayah Kota Depok.</p>
        </div>
        <a href="{% url 'logout' %}" class="logout">
            <i data-lucide="log-out"></i><span>Keluar</span>
        </a>
    </div>

</aside>
{% endwith %}
