{% extends 'base.html' %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h5 class="fw-bold mb-1">Ubah Jadwal Penjemputan</h5>
    <p class="text-muted small mb-4">ID Penjemputan: #{{ pickup.id }}</p>

    <form method="POST">
      {% csrf_token %}
      
      <!-- Tanggal Penjemputan -->
      <div class="mb-3">
        <label for="pickup_date" class="form-label fw-semibold small">Tanggal Penjemputan Baru</label>
        <input type="date" class="form-control" id="pickup_date" name="pickup_date" value="{{ pickup.pickup_date|date:'Y-m-d' }}" required>
      </div>

      <!-- Slot Waktu -->
      <div class="mb-3">
        <label for="time_slot" class="form-label fw-semibold small">Slot Waktu</label>
        <select class="form-select" id="time_slot" name="time_slot" required>
          <option value="09:00 - 11:00" {% if pickup.time_slot == '09:00 - 11:00' %}selected{% endif %}>09:00 - 11:00 WIB</option>
          <option value="11:00 - 13:00" {% if pickup.time_slot == '11:00 - 13:00' %}selected{% endif %}>11:00 - 13:00 WIB</option>
          <option value="14:00 - 16:00" {% if pickup.time_slot == '14:00 - 16:00' %}selected{% endif %}>14:00 - 16:00 WIB</option>
        </select>
      </div>

      <!-- Catatan Tamabaahan -->
      <div class="mb-4">
        <label for="notes" class="form-label fw-semibold small">Catatan (Opsional)</label>
        <textarea class="form-control" id="notes" name="notes" rows="3">{{ pickup.notes }}</textarea>
      </div>

      <div class="d-flex gap-2">
        <a href="{% url 'mitra_dashboard' %}" class="btn btn-light rounded-pill flex-fill">Batal</a>
        <button type="submit" class="btn btn-success rounded-pill flex-fill fw-semibold" style="background-color: #1b5e20;">Simpan Perubahan</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
